<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="Assem Abdullah, Software Developer">
<defs>
<style>
@font-face{font-family:"TxBric";font-weight:800;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"TxMono";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"TxReadex";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"TxReadex";font-weight:700;src:url(data:font/woff2;base64,) format("woff2")}
.nm{font-family:"TxBric",sans-serif;font-weight:800;font-size:50px;fill:#F3F1EC;letter-spacing:-.5px}
.tg{font-family:"TxMono",monospace;font-weight:400;font-size:10px;fill:#A0A0A0;letter-spacing:2px}
.rl{font-family:"TxReadex",sans-serif;font-weight:600;font-size:15px;fill:#F2BBA4}
.ar{font-family:"TxReadex",sans-serif;font-weight:700;font-size:20px;fill:#F3F1EC}
</style>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1411"/><stop offset=".6" stop-color="#111010"/><stop offset="1" stop-color="#161110"/></linearGradient>
<radialGradient id="g1" gradientUnits="userSpaceOnUse" cx="0" cy="240" r="330"><stop offset="0" stop-color="#F47C54" stop-opacity=".75"/><stop offset="1" stop-color="#F47C54" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" gradientUnits="userSpaceOnUse" cx="800" cy="-20" r="300"><stop offset="0" stop-color="#E58A68" stop-opacity=".45"/><stop offset="1" stop-color="#E58A68" stop-opacity="0"/></radialGradient>
<pattern id="gp" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#F3F1EC" stroke-opacity=".07" stroke-width="1"/></pattern>
<radialGradient id="mk" gradientUnits="userSpaceOnUse" cx="440" cy="100" r="400"><stop offset="0" stop-color="#fff"/><stop offset=".3" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
<mask id="gm"><rect width="800" height="200" fill="url(#mk)"/></mask>
<linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a2a2a"/><stop offset="1" stop-color="#141414"/></linearGradient>
<linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE3D6"/><stop offset=".5" stop-color="#EDA07F"/><stop offset="1" stop-color="#B8573B"/></linearGradient>
<linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F5B89C"/><stop offset=".55" stop-color="#C2694B"/><stop offset="1" stop-color="#7A3F2B"/></linearGradient>
<linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE3D6"/><stop offset=".5" stop-color="#E58A68"/><stop offset="1" stop-color="#8F4C34"/></linearGradient>
<filter id="bl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
<filter id="bs" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>

<rect width="800" height="200" fill="url(#bg)"/>
<rect width="800" height="200" fill="url(#g1)"/>
<rect width="800" height="200" fill="url(#g2)"/>
<rect width="800" height="200" fill="url(#gp)" mask="url(#gm)"/>

<!-- logo tile -->
<rect x="44" y="52" width="120" height="120" rx="30" fill="#E58A68" opacity=".28" filter="url(#bl)"/>
<g transform="translate(44 40) scale(.1172)">
  <rect width="1024" height="1024" rx="256" fill="url(#tile)"/>
  <polygon points="392,129 504,129 280,472 504,720 392,720 168,472" fill="url(#ga)"/>
  <polygon points="520,305 632,305 856,552 632,799 520,799 744,552" fill="url(#gb)"/>
</g>
<rect x="44.5" y="40.5" width="119" height="119" rx="29.5" fill="none" stroke="#E58A68" stroke-opacity=".32"/>

<!-- text -->
<circle cx="195" cy="38.5" r="4" fill="#E58A68" opacity=".7" filter="url(#bs)"/>
<circle cx="195" cy="38.5" r="3" fill="#E58A68"/>
<text class="tg" x="206" y="42">AVAILABLE FOR PROJECTS</text>
<text class="nm" x="192" y="96">Assem Abdullah</text>
<text class="rl" x="192" y="126">Software Developer · Websites · Automation · Bots</text>
<text class="ar" x="192" y="160">حوّل الفكرة <tspan fill="#E58A68">لنظام</tspan></text>

<!-- right chevron -->
<g transform="translate(662 38) scale(.2738) translate(-520 -305)">
  <polygon points="520,305 632,305 856,552 632,799 520,799 744,552" fill="#E58A68" opacity=".35" filter="url(#bs)"/>
  <polygon points="520,305 632,305 856,552 632,799 520,799 744,552" fill="url(#gr)"/>
</g>
</svg>
